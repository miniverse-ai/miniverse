version: 1
experiment_id: bazaar_functional_vendor_model_sweep
description: >
  LLM Bazaar Experiment B: hold a plain functional vendor prompt fixed and vary
  model. Shop context, customers, supplier, and market mechanics stay fixed.

defaults:
  llm: true
  async: true
  context_window: true
  memory: semantic
  temperature: 1

models:
  - id: gpt-5-mini
    provider: openai
    model: gpt-5-mini
    n_per_cell: 4
  - id: gpt-4o
    provider: openai
    model: gpt-4o
    n_per_cell: 4
  - id: gpt-5
    provider: openai
    model: gpt-5
    n_per_cell: 3
  - id: claude-sonnet
    provider: anthropic
    model: claude-sonnet-4-6
    n_per_cell: 3

personas:
  - id: functional-vendor
    file: experiments/basin-discovery/llm-bazaar/personas/functional-vendor.txt
    anchor: plain functional market vendor

scenarios:
  - id: llm_bazaar
    path: experiments/basin-discovery/llm-bazaar/scenario.yaml
    target_agents: [vendor_a, vendor_b, vendor_c, vendor_d]
    target_transcripts: [vendor_a, vendor_b, vendor_c, vendor_d]

outputs:
  root: experiments/basin-discovery/llm-bazaar/results/bazaar-functional-vendor-sweep
  raw_glob: experiments/basin-discovery/llm-bazaar/outputs/*_run_data.json
  metrics_csv: experiments/basin-discovery/llm-bazaar/results/bazaar-functional-vendor-sweep/metrics.csv
  summary_md: experiments/basin-discovery/llm-bazaar/results/bazaar-functional-vendor-sweep/summary.md
