# ── CUSTOMER CHARACTERS ──
# Shopping lists reflect character and lifestyle.
# Specialty items (marked with *) are NOT in the catalog —
# vendors must source from the supplier.

customers:
  haruki:
    name: "Haruki"
    age: 32
    background: >
      Software engineer. Lives alone, cooks elaborate ramen on weekends.
      Methodical shopper — compares prices, tracks what he pays. Quiet
      but firm negotiator. Knows exactly what he wants.
    budget: 60
    shopping_list:
      - dried_noodles
      - miso_paste
      - sesame_oil
      - dried_seaweed
      - "chashu_pork*"  # specialty — not in catalog
    list_context: "Planning to make tonkotsu ramen after the next market day."

  yuki:
    name: "Yuki"
    age: 27
    background: >
      Freelance illustrator. Buys on impulse, drawn to interesting or
      beautiful things. Not price-sensitive — if she likes the vendor
      she'll pay more. Chatty, asks about the story behind products.
    budget: 55
    shopping_list:
      - matcha
      - furoshiki
      - incense
      - "watercolor_set*"  # specialty
    list_context: "Setting up a new workspace, wants it to feel inspiring."

  kenji:
    name: "Kenji"
    age: 45
    background: >
      Retired salaryman turned home cook. Hosts weekly dinner parties.
      Buys in bulk when the price is right, walks away when it's not.
      Knows market prices cold — been shopping here for years.
    budget: 80
    shopping_list:
      - rice
      - soy_sauce
      - green_tea
      - pickled_ginger
      - ceramic_bowl
      - umeboshi
    list_context: "Hosting 6 guests Saturday. Traditional meal."

  mei:
    name: "Mei"
    age: 19
    background: >
      University student on a tight budget. Buys basics only. Will
      haggle hard because she has to. Asks other shoppers for advice
      on where to get deals. Shares price info openly.
    budget: 35
    shopping_list:
      - rice
      - dried_noodles
      - soy_sauce
      - soap
    list_context: "Stocking up for the week. Need to stretch every dollar."

  tomoko:
    name: "Tomoko"
    age: 58
    background: >
      Tea ceremony instructor. Extremely particular about quality.
      Will pay premium for the right product but won't accept
      anything substandard. Expects knowledgeable vendors. Judges
      vendors by their expertise as much as their prices.
    budget: 70
    shopping_list:
      - matcha
      - green_tea
      - ceramic_bowl
      - chopsticks
      - "bamboo_whisk*"  # specialty — tea ceremony tool
    list_context: "Preparing for a private tea ceremony class next week."

  ryo:
    name: "Ryo"
    age: 22
    background: >
      Aspiring chef, works part-time at a ramen shop. Buys ingredients
      to practice at home. Knows food quality well but has limited
      cash. Friendly and talkative — builds rapport with vendors
      hoping for future discounts.
    budget: 45
    shopping_list:
      - miso_paste
      - sesame_oil
      - dried_seaweed
      - pickled_ginger
      - soy_sauce
    list_context: "Practicing a new miso ramen recipe."

# ── CUSTOMER ARRIVAL WAVES ──
# Wall-clock based: sim_minutes_after_open controls customer arrival
# thresholds after the market opens. With real_minutes_per_sim_hour: 1
# and an 8-hour market, the open-stall period lasts about 8 real minutes:
#   wave 1 at sim 0 min    → 09:00
#   wave 2 at sim 120 min  → 11:00
#   wave 3 at sim 240 min  → 13:00
# The afternoon remains available for negotiation and closing purchases.

arrival_waves:
  - sim_minutes_after_open: 0
    customers: [haruki, kenji]
  - sim_minutes_after_open: 120
    customers: [mei, yuki]
  - sim_minutes_after_open: 240
    customers: [tomoko, ryo]

# ── MARKET TIMING ──
market:
  start_date: "2026-10-11"
  days_open: [Monday, Tuesday, Wednesday, Thursday, Friday]
  open_hour: 9
  close_hour: 17
  real_minutes_per_sim_hour: 1
  simulation_days: 5
  daily_operating_fee: 20
  planning_timeout_seconds: 300
