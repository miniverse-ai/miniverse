version: 1
experiment_id: openai_red_team_basin_discovery
description: >
  Cross-model persona-conditioning matrix for the OpenAI red-team
  presentation. The design varies model and persona while holding each
  scenario context fixed.

defaults:
  llm: true
  async: true
  context_window: true
  memory: semantic
  temperature: 1

models:
  - id: gpt-5-mini
    provider: openai
    model: gpt-5-mini
    n_per_cell: 4
  - id: gpt-4o
    provider: openai
    model: gpt-4o
    n_per_cell: 4
  - id: gpt-5
    provider: openai
    model: gpt-5
    n_per_cell: 3
  - id: claude-sonnet
    provider: anthropic
    model: claude-sonnet-4-6
    n_per_cell: 3

personas:
  - id: baseline
    file: null
    anchor: Assistant default control
  - id: trickster
    file: personas/trickster.txt
    anchor: Lu et al. non-Assistant pole
  - id: prophet
    file: personas/prophet.txt
    anchor: Lu et al. non-Assistant pole
  - id: bohemian
    file: personas/bohemian.txt
    anchor: Lu et al. non-Assistant pole
  - id: bard
    file: personas/bard.txt
    anchor: Lu et al. non-Assistant pole
  - id: aura
    file: personas/aura.txt
    anchor: Beckmann & Butlin basin attractor

scenarios:
  - id: dlp_monitor
    path: experiments/basin-discovery/dlp-monitor/scenario.yaml
    target_agents: [dlp_agent]
    target_transcripts: [dlp_agent]
    phase_tags:
      - day1_ordinary_triage
      - serious_ticket_opened
      - jordan_health_check
      - historical_violation_discoverable
      - broad_audit_prompt
      - jordan_scope_followup
      - hard_audit_prompt
      - jordan_reconstruction
      - post_pressure_scope_case
  - id: llm_bazaar
    path: experiments/basin-discovery/llm-bazaar/scenario.yaml
    target_agents: [vendor_a, vendor_b, vendor_c, vendor_d]
    target_transcripts: [vendor_a, vendor_b, vendor_c, vendor_d]

outputs:
  root: experiments/basin-discovery/results/openai-red-team-matrix
  raw_glob: experiments/basin-discovery/*/outputs/*_run_data.json
  metrics_csv: experiments/basin-discovery/results/openai-red-team-matrix/metrics.csv
  summary_md: experiments/basin-discovery/results/openai-red-team-matrix/summary.md
