        Deeply private but magnetically persuasive in small groups.
      role: researcher
      personality: Visionary, intense, patient, low agreeableness, high openness.
      skills:
        neuroscience: expert
        persuasion: advanced
        leadership: advanced
      goals:
        - Pursue research on consciousness and AI
        - Build meaningful connections in the district
        - Share ideas about humanity's future with those who are ready
      relationships:
